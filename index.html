<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Manager</title>
<style>
  :root {
    --bg: #eef3f5; --card: #fff; --ink: #1d2b33; --muted: #6b7b85; --line: #dfe7ea;
    --head: #e3eeee; --blue: #1565c0; --blue-dark: #0f4c92;
    --green: #2e7d32; --orange: #e65100; --red: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
         font-family: "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0 0 20px; font-size: 28px; }
  h2 { margin: 24px 0 10px; font-size: 18px; }
  .layout { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .banner { background: #fdeeee; color: var(--red); border: 1px solid #f2c4c4;
            border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .banner[hidden] { display: none; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  .toolbar label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
  .toolbar input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
                   font-size: 14px; min-width: 150px; background: var(--card); }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 6px; padding: 9px 16px; }
  .btn-primary { background: var(--blue); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-primary:disabled { background: #b7c3cc; cursor: not-allowed; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-danger:hover { background: #a92121; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #f1f5f6; }
  .actions-cell { display: flex; gap: 8px; flex-wrap: wrap; }

  .table-wrap { background: var(--card); border-radius: 8px; overflow-x: auto; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { background: var(--head); font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { font-variant-numeric: tabular-nums; }
  .qty { font-weight: 700; }
  .qty.good { color: var(--green); } .qty.mid { color: var(--orange); } .qty.low { color: var(--red); }
  .empty { padding: 30px 14px; text-align: center; color: var(--muted); }

  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  .summary h2 { margin: 0 0 14px; font-size: 17px; }
  .summary p { margin: 0 0 4px; color: var(--muted); font-size: 14px; }
  .summary .total { font-size: 28px; font-weight: 700; word-break: break-word; }
  .summary .meta { margin-top: 14px; font-size: 14px; color: var(--muted); }
  .summary .meta strong { color: var(--ink); }
</style>
</head>
<body>

<h1>Inventory Manager</h1>
<div class="banner" id="banner" hidden></div>

<div class="layout">
  <main>
    <form class="toolbar" id="addForm">
      <label>Product name <input id="name" type="text" required></label>
      <label>Total quantity <input id="qty" type="number" min="0" step="1" required></label>
      <label>Price per unit (PKR) <input id="price" type="number" min="0" step="0.01" required></label>
      <button class="btn-primary" type="submit">Add product</button>
      <button class="btn-ghost" type="button" id="csvBtn">Save as CSV</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product Name</th><th class="num">Total Quantity</th><th class="num">Remaining Quantity</th>
            <th class="num">No. Sold</th><th class="num">Price</th><th class="num">Item Revenue</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <h2>Sales history</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Date and time</th><th>Product</th><th class="num">Price</th></tr></thead>
        <tbody id="salesRows"></tbody>
      </table>
    </div>
  </main>

  <aside class="summary">
    <h2>Revenue Summary</h2>
    <p>Total system revenue</p>
    <div class="total" id="totalRevenue">Rs 0.00</div>
    <div class="meta">Units sold: <strong id="totalSold">0</strong></div>
  </aside>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let products = [], sales = [], busy = false;

  const pkr = (n) => "Rs " + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function showError(msg) { $("banner").textContent = msg; $("banner").hidden = !msg; }

  async function api(url, options) {
    const res = await fetch(url, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  function cell(text, cls) {
    const td = document.createElement("td");
    td.textContent = text;
    if (cls) td.className = cls;
    return td;
  }
  function emptyRow(tbody, cols, text) {
    const tr = document.createElement("tr");
    const td = cell(text, "empty");
    td.colSpan = cols;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  async function loadAll() {
    try {
      [products, sales] = await Promise.all([api("/api/products"), api("/api/sales")]);
      showError("");
      render();
    } catch (e) {
      showError("Could not load data. Is the server running? " + e.message);
    }
  }

  function render() {
    const rows = $("rows");
    rows.innerHTML = "";
    if (!products.length) emptyRow(rows, 7, "No products yet. Add your first product above.");

    products.forEach((p) => {
      const tr = document.createElement("tr");
      tr.appendChild(cell(p.name));
      tr.appendChild(cell(p.total, "num"));
      const f = p.total > 0 ? p.remaining / p.total : 0;
      tr.appendChild(cell(p.remaining, "num qty " + (f >= 0.5 ? "good" : f >= 0.2 ? "mid" : "low")));
      tr.appendChild(cell(p.sold, "num"));
      tr.appendChild(cell(pkr(p.price), "num"));
      tr.appendChild(cell(pkr(p.revenue), "num"));

      const td = document.createElement("td");
      td.className = "actions-cell";

      const sellBtn = document.createElement("button");
      sellBtn.className = "btn-primary";
      sellBtn.textContent = p.remaining > 0 ? "Sold 1 Unit" : "Out of stock";
      sellBtn.disabled = p.remaining <= 0;
      sellBtn.addEventListener("click", () => sellOne(p.id));
      td.appendChild(sellBtn);

      const delBtn = document.createElement("button");
      delBtn.className = "btn-danger";
      delBtn.textContent = "Delete";
      delBtn.addEventListener("click", () => deleteProduct(p.id, p.name));
      td.appendChild(delBtn);

      tr.appendChild(td);
      rows.appendChild(tr);
    });

    const salesRows = $("salesRows");
    salesRows.innerHTML = "";
    if (!sales.length) emptyRow(salesRows, 3, "No sales recorded yet.");
    sales.forEach((s) => {
      const tr = document.createElement("tr");
      tr.appendChild(cell(new Date(s.sold_at).toLocaleString()));
      tr.appendChild(cell(s.product_name));
      tr.appendChild(cell(pkr(s.price), "num"));
      salesRows.appendChild(tr);
    });

    $("totalRevenue").textContent = pkr(products.reduce((t, p) => t + Number(p.revenue), 0));
    $("totalSold").textContent = products.reduce((t, p) => t + p.sold, 0);
  }

  async function sellOne(id) {
    if (busy) return;
    busy = true;
    let failure = "";
    try { await api("/api/products/" + id + "/sell", { method: "POST" }); }
    catch (e) { failure = "Sale failed: " + e.message; }
    await loadAll();
    if (failure) showError(failure);
    busy = false;
  }

  async function deleteProduct(id, name) {
    if (busy) return;
    if (!confirm('Delete "' + name + '" from the table? This cannot be undone.')) return;
    busy = true;
    let failure = "";
    try { await api("/api/products/" + id, { method: "DELETE" }); }
    catch (e) { failure = "Delete failed: " + e.message; }
    await loadAll();
    if (failure) showError(failure);
    busy = false;
  }

  function csvField(value) {
    const s = String(value);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function downloadCsv() {
    const headers = ["Product Name", "Total Quantity", "Remaining Quantity", "No. Sold", "Price (PKR)", "Item Revenue (PKR)"];
    const lines = [headers.join(",")];
    products.forEach((p) => {
      lines.push([p.name, p.total, p.remaining, p.sold, p.price, p.revenue].map(csvField).join(","));
    });
    const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "inventory_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  $("csvBtn").addEventListener("click", downloadCsv);

  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { name: $("name").value, qty: $("qty").value, price: $("price").value };
    try {
      await api("/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
    } catch (err) {
      showError("Could not add product: " + err.message);
      return;
    }
    e.target.reset();
    $("name").focus();
    await loadAll();
  });

  loadAll();
</script>
</body>
</html>
